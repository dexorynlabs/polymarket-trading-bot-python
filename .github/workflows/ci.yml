name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Each bot folder is self-contained. Add a folder here once it has a
  # requirements.txt and a tests/ directory; a bot that is still README-only
  # does not affect the badge.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot:
          - copy-trading-bot
    defaults:
      run:
        working-directory: ${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: pytest -q
